kogito.service.url=${knative:services.v1.serving.knative.dev/custom-functions/workflow}

quarkus.native.native-image-xmx=8g
quarkus.kubernetes.deployment-target=knative
# The name of the application. This value will be used for naming Kubernetes resources like: Deployment, Service,  etc.
quarkus.knative.name=workflow
#quarkus.knative.namespace=custom-functions
quarkus.knative.image-pull-policy=if-not-present

#quarkus.knative.service-account=custom-functions

#don't work
#quarkus.knative.containers."workflow".service-account=workflow

#don't work
#quarkus.knative.containers.workflow.service-account=abc

quarkus.knative.rbac.service-accounts."workflow".use-as-default=true


%container.quarkus.container-image.build=true
# Since the quarkus project has no java files, Quarkus 3.2.10.Final is picking the default image base: registry.access.redhat.com/ubi8/openjdk-11-runtime:1.16'
# Not good, since the workflows requires java 17. Quarkus 3.8.1 picks openjdk-17 even when no java files.
%container.quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi8/openjdk-17-runtime:1.16
%container.quarkus.container-image.registry=dev.local
%container.quarkus.container-image.group=${USER}
