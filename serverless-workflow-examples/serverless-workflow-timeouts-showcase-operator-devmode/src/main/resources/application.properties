quarkus.http.port=8080

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

quarkus.devservices.enabled=false
quarkus.swagger-ui.always-include=true

# local dns service names are ok for this example ui since invocations to the formal SWs occurs withing the cluster.
#<serviceName>.<namespaceName>.svc.cluster.local
quarkus.rest-client.callback_state_timeouts.url=http://callbackstatetimeouts.timeouts-showcase.svc.cluster.local
quarkus.rest-client.switch_state_timeouts.url=http://localhost:9090
quarkus.rest-client.event_state_timeouts.url=http://localhost:9090


# This enables Knative to fetch the image information on Minikube.
# You can change this property with -Pknative -Dquarkus.container-image.group from the command line.
quarkus.container-image.build=true
quarkus.container-image.group=${USER}
quarkus.container-image.registry=dev.local
quarkus.container-image.name=timeouts-showcase-operator-devmode-ui
quarkus.container-image.tag=1.0-SNAPSHOT
quarkus.kubernetes.service-type=node-port
quarkus.kubernetes.image-pull-policy=if-not-present

# Profile to pack this example into a container, to use it execute activate the maven container profile, -Dcontainer
%container.quarkus.container-image.build=true
%container.quarkus.container-image.push=false
%container.quarkus.container-image.group=${USER}
%container.quarkus.container-image.registry=dev.local
%container.quarkus.container-image.name=timeouts-showcase-operator-devmode-ui
%container.quarkus.container-image.tag=1.0-SNAPSHOT
%container.quarkus.jib.jvm-entrypoint=/home/kogito/kogito-app-launch.sh
%container.quarkus.jib.base-jvm-image=quay.io/kiegroup/kogito-runtime-jvm:latest
%container.quarkus.jib.working-directory=/home/kogito/bin
