quarkus.openapi-generator.codegen.spec.eu_central_bank_service_yml.base-package=com.eu.central.bank
quarkus.openapi-generator.codegen.spec.acme_financial_service_yml.base-package=com.acme

quarkus.log.category."org.kie.kogito.examples".level=DEBUG

quarkus.rest-client.eu_central_bank_service_yml.url=http://localhost:8383
quarkus.rest-client.acme_financial_service_yml.url=http://localhost:8484

quarkus.oidc-client.eu_central_bank_oauth.auth-server-url=http://localhost:8281/auth/realms/kogito
quarkus.oidc-client.eu_central_bank_oauth.client-id=kogito-app
quarkus.oidc-client.eu_central_bank_oauth.grant.type=client
quarkus.oidc-client.eu_central_bank_oauth.credentials.client-secret.method=basic
quarkus.oidc-client.eu_central_bank_oauth.credentials.client-secret.value=secret


