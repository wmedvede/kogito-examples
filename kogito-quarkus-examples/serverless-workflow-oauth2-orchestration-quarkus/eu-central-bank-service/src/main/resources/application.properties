quarkus.http.port=8383
quarkus.swagger-ui.always-include=true


quarkus.http.auth.permission.process-endpoints-permit.paths=/*
quarkus.http.auth.permission.process-endpoints-permit.policy=authenticated

## we enable the tenant and only when the authentication profile is activated
quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=http://localhost:8281/auth/realms/kogito
#quarkus.oidc.client-id=kogito-jobs-service2
#quarkus.oidc.application-type=service2
#quarkus.oidc.credentials.secret=secret2
