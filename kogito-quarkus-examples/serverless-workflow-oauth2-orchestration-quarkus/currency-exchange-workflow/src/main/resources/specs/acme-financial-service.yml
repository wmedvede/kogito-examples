---
openapi: 3.0.3
info:
  title: Acme Financial Service API
  version: 1.0.1
paths:
  /financial-service/exchange-rate:
    get:
      tags:
        - Acme Financial Resource
      operationId: exchangeRate
      parameters:
        - name: currencyFrom
          in: query
          schema:
            type: string
        - name: currencyTo
          in: query
          schema:
            type: string
        - name: exchangeDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcmeExchangeResult'
      security:
        - acme-financial-oauth: []
components:
  schemas:
    AcmeExchangeResult:
      type: object
      properties:
        exchangeRate:
          format: double
          type: number
  securitySchemes:
    acme-financial-oauth:
      type: oauth2
      flows:
        clientCredentials:
          authorizationUrl: https://example.com/oauth
          tokenUrl: https://example.com/oauth/token
          scopes: {}